name: Pluton
options:
  bundleIdPrefix: io.github.vykosmolt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework PlutonCore -lsqlite3"
targets:
  Pluton:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Data
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vykosmolt.pluton
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    preBuildScripts:
      - name: Sync French data
        script: "$SRCROOT/sync-resources.sh"
      - name: Build shared Kotlin framework
        script: |
          # CI links a prebuilt static framework and sets PLUTON_SKIP_GRADLE=1.
          if [ "${PLUTON_SKIP_GRADLE:-0}" != "1" ]; then
            cd "$SRCROOT/.."
            ./gradlew :shared:embedAndSignAppleFrameworkForXcode
          fi
