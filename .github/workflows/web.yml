name: Web checks

on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "public/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "public/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test

      # The generated French data is gitignored, and Vite bundles it at runtime rather than importing it.
      # Invoking vite directly checks that the Svelte sources compile without requiring the 188 MB data build;
      # `npm run build` remains the full asset-validating build used before deployment.
      - run: npx vite build

  smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The deployment branch carries the exact JSON/audio bundle the web app serves. Pull it into public/data
      # so the smoke run exercises the real generated assets, including the offline service worker.
      - name: Fetch the deployed data bundle
        run: |
          set -e
          git fetch --depth=1 origin gh-pages
          mkdir -p public/data
          git archive origin/gh-pages data/fr | tar -x -C public
          test -f public/data/fr/words.json
          test -d public/data/fr/audio

      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
