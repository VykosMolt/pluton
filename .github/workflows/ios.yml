name: iOS unsigned IPA

# Builds the SwiftUI app with the shared Kotlin framework on a macOS runner and uploads an unsigned IPA.
# Linux can't run Xcode or Kotlin/Native iOS linking; signing/installing happens on the user's side (iloader or
# TrollStore — see native/iosApp/INSTALL.md).

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - "public/data/fr/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the shared Kotlin framework (device, release)
        working-directory: native
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Generate the Xcode project
        working-directory: native/iosApp
        run: xcodegen generate

      - name: Build the app (unsigned)
        working-directory: native/iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -project Pluton.xcodeproj \
            -scheme Pluton \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            FRAMEWORK_SEARCH_PATHS="$PWD/../shared/build/bin/iosArm64/releaseFramework" \
            PLUTON_SKIP_GRADLE=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the IPA
        working-directory: native/iosApp
        run: |
          APP="build/Build/Products/Release-iphoneos/Pluton.app"
          test -d "$APP"
          rm -rf Payload Pluton-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Pluton-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: pluton-ios-unsigned
          path: native/iosApp/Pluton-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
